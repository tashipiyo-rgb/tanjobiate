<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Birthday Oracle">
<meta name="theme-color" content="#0a0800">
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" id="pwa-icon">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>誕生日あて</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Serif+JP:wght@300;400;700&display=swap');

:root{
  --gold:#d4a843;
  --gold-light:#f5c842;
  --gold-dim:#7a5a18;
  --sand:#e8c87a;
  --sand-pale:#f0dfa0;
  --bg-deep:#0a0800;
  --bg-mid:#120e02;
  --bg-card:#1a1402;
  --text:#e8d89a;
  --text-dim:#8a7840;
  --accent:#c87820;
  --purple:#4a1a00;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg-deep);
  color:var(--text);
  font-family:'Noto Serif JP',serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* 砂漠の星空 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(212,168,67,.08) 0%, transparent 60%),
    radial-gradient(1px 1px at 8% 12%,rgba(255,240,180,.9) 0%,transparent 100%),
    radial-gradient(1px 1px at 18% 35%,rgba(255,240,180,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 28% 8%, rgba(255,240,180,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 38% 22%,rgba(255,240,180,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 48% 5%, rgba(255,240,180,.9) 0%,transparent 100%),
    radial-gradient(1px 1px at 58% 18%,rgba(255,240,180,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 68% 30%,rgba(255,240,180,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 78% 10%,rgba(255,240,180,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 88% 25%,rgba(255,240,180,.5) 0%,transparent 100%),
    radial-gradient(2px 2px at 22% 55%,rgba(255,220,100,.4) 0%,transparent 100%),
    radial-gradient(2px 2px at 62% 65%,rgba(255,220,100,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 42% 75%,rgba(255,240,180,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 82% 80%,rgba(255,240,180,.5) 0%,transparent 100%);
}

/* 下部の砂地グラデ */
body::after{
  content:'';position:fixed;bottom:0;left:0;right:0;height:120px;pointer-events:none;z-index:0;
  background:linear-gradient(to top, rgba(30,20,0,.6) 0%, transparent 100%);
}

.container{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:52px 24px 72px;}

/* ── HEADER ── */
.header{text-align:center;margin-bottom:44px;}

.magic-eye{width:80px;height:80px;margin:0 auto 22px;}
.magic-eye svg{width:100%;height:100%;animation:eyePulse 3s ease-in-out infinite;}
@keyframes eyePulse{
  0%,100%{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 20px rgba(212,168,67,.4));transform:scale(1);}
  50%{filter:drop-shadow(0 0 20px var(--gold-light)) drop-shadow(0 0 40px rgba(212,168,67,.6));transform:scale(1.1);}
}

.title{
  font-family:'Cinzel Decorative',cursive;
  font-size:clamp(1.6rem,6vw,2.4rem);font-weight:900;
  background:linear-gradient(135deg,#7a5a18 0%,#f5c842 30%,#d4a843 55%,#f5c842 75%,#7a5a18 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.08em;line-height:1.2;margin-bottom:8px;
  text-shadow:none;
}

.subtitle{font-size:.8rem;color:var(--text-dim);letter-spacing:.4em;}

/* ── DIVIDER ── */
.divider{display:flex;align-items:center;gap:12px;margin:24px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.gem{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 12px var(--gold);}

/* ── INSTRUCTION ── */
.instr{
  background:linear-gradient(135deg,#150f00 0%,#1e1600 100%);
  border:1px solid rgba(212,168,67,.25);border-radius:3px;
  padding:26px 28px;margin-bottom:30px;position:relative;overflow:hidden;
}
.instr::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.instr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}

/* 四隅装飾 */
.instr-corner{position:absolute;width:12px;height:12px;border-color:var(--gold-dim);border-style:solid;opacity:.7;}
.instr-corner.tl{top:6px;left:6px;border-width:1px 0 0 1px;}
.instr-corner.tr{top:6px;right:6px;border-width:1px 1px 0 0;}
.instr-corner.bl{bottom:6px;left:6px;border-width:0 0 1px 1px;}
.instr-corner.br{bottom:6px;right:6px;border-width:0 1px 1px 0;}

.instr-title{font-size:.65rem;letter-spacing:.5em;color:var(--gold);margin-bottom:18px;text-align:center;}
.steps{display:flex;flex-direction:column;gap:14px;}
.step{display:flex;gap:14px;align-items:flex-start;}
.sn{
  min-width:26px;height:26px;border:1px solid var(--gold-dim);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.68rem;color:var(--gold);font-family:'Cinzel Decorative',cursive;
  flex-shrink:0;margin-top:2px;background:rgba(212,168,67,.08);
}
.st{font-size:.88rem;line-height:1.8;}
.hl{color:var(--gold-light);font-weight:700;}
.dim{color:var(--text-dim);font-size:.8rem;}

/* ── INPUT ── */
.ilabel{display:block;font-size:.65rem;letter-spacing:.45em;color:var(--gold);margin-bottom:12px;text-align:center;}

.minput{
  width:100%;
  background:rgba(0,0,0,.7);
  border:2px solid rgba(212,168,67,.4);
  border-radius:3px;
  padding:20px 20px;
  font-size:2rem;
  color:var(--gold-light);
  font-family:'Cinzel Decorative',cursive;
  letter-spacing:.18em;
  text-align:center;
  outline:none;
  transition:all .4s;
  box-shadow:0 0 20px rgba(212,168,67,.15),inset 0 0 30px rgba(0,0,0,.8);
}
.minput:focus{
  border-color:var(--gold);
  background:rgba(0,0,0,.85);
  box-shadow:0 0 40px rgba(212,168,67,.4),0 0 80px rgba(212,168,67,.1),inset 0 0 30px rgba(0,0,0,.9);
  color:var(--gold-light);
  letter-spacing:.25em;
}
.minput::placeholder{color:rgba(212,168,67,.3);font-size:.9rem;letter-spacing:.1em;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}

/* ── BUTTON ── */
.rbtn{
  width:100%;padding:18px;margin-top:16px;
  background:linear-gradient(135deg,#0a0800 0%,#2a1a00 40%,#1a1000 100%);
  border:2px solid rgba(212,168,67,.5);border-radius:3px;
  color:var(--gold-light);
  font-family:'Cinzel Decorative',cursive;
  font-size:.95rem;letter-spacing:.28em;cursor:pointer;
  position:relative;overflow:hidden;transition:all .3s;
  box-shadow:0 0 20px rgba(212,168,67,.2);
  text-shadow:0 0 12px rgba(212,168,67,.6);
}
.rbtn::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(212,168,67,.2),transparent);
  transition:left .6s;
}
.rbtn:hover::before{left:100%;}
.rbtn:hover{
  border-color:var(--gold-light);
  box-shadow:0 0 40px rgba(212,168,67,.5),0 0 80px rgba(212,168,67,.2);
  transform:translateY(-2px);
  color:#fff;
}
.rbtn:active{transform:translateY(0);}

/* ── RESULT ── */
.rarea{margin-top:32px;display:none;}
.rarea.show{display:block;animation:fadeUp .6s ease forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.bcard{
  background:linear-gradient(135deg,#120e02 0%,#0e1010 100%);
  border:1px solid rgba(212,168,67,.3);border-radius:3px;
  padding:28px;margin-bottom:16px;position:relative;overflow:hidden;
}
.bcard::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(212,168,67,.07) 0%,transparent 60%);
}
/* 四隅 */
.bcard::after{content:'';position:absolute;top:8px;right:8px;width:10px;height:10px;border-top:1px solid var(--gold-dim);border-right:1px solid var(--gold-dim);}

.cnum{font-size:.6rem;letter-spacing:.45em;color:var(--text-dim);margin-bottom:18px;}
.crow{
  display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid rgba(212,168,67,.12);
}
.crow:last-of-type{padding-bottom:0;margin-bottom:0;border-bottom:none;}
.cl{font-size:.72rem;color:var(--text-dim);letter-spacing:.15em;}
.cv{font-size:1.05rem;color:var(--sand);font-weight:700;}
.cv.big{
  font-family:'Cinzel Decorative',cursive;font-size:1.5rem;
  color:var(--gold-light);text-shadow:0 0 20px rgba(212,168,67,.5);
}

.egrid{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;
  background:rgba(212,168,67,.15);border-top:1px solid rgba(212,168,67,.15);margin-top:6px;
}
.ecell{background:rgba(0,0,0,.3);padding:14px 8px;text-align:center;}
.ecell .cl{display:block;margin-bottom:6px;}
.ecell .cv{font-size:1rem;}
.zsym{font-size:1.6rem;display:block;line-height:1;margin-bottom:3px;}
.dnum{font-family:'Cinzel Decorative',cursive;font-size:1rem;color:var(--gold-light);}
.csub{font-size:.62rem;color:var(--text-dim);margin-top:3px;}

.fnote{font-size:.7rem;color:var(--text-dim);text-align:center;margin:8px 0 14px;font-style:italic;}
.rcount{font-size:.7rem;color:var(--text-dim);text-align:center;margin-bottom:14px;letter-spacing:.15em;}
.errmsg{background:rgba(140,30,0,.2);border:1px solid rgba(200,80,0,.4);border-radius:3px;padding:16px;font-size:.88rem;color:#f4a060;text-align:center;}
.nores{text-align:center;padding:22px;color:var(--text-dim);font-size:.88rem;}
.rstbtn{
  background:none;border:1px solid rgba(212,168,67,.25);border-radius:3px;
  color:var(--text-dim);font-family:'Noto Serif JP',serif;font-size:.8rem;
  padding:10px 24px;cursor:pointer;display:block;margin:16px auto 0;letter-spacing:.12em;transition:all .2s;
}
.rstbtn:hover{color:var(--gold);border-color:var(--gold-dim);}

/* sparkle */
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:100;display:none;}
.sparkle{position:absolute;background:var(--gold-light);border-radius:50%;animation:spk 1.3s ease-out forwards;}
@keyframes spk{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0);}}
</style>
</head>

<div class="container">
  <div class="header">
    <div class="magic-eye">

        <path d="M8 38 Q40 58 72 38" stroke="#d4a843" stroke-width="1.5" fill="none" opacity=".5"/>

        <path d="M60 48 L68 62 L62 62" stroke="#d4a843" stroke-width="1.5" fill="none" opacity=".7"/>
        <path d="M62 62 L58 72" stroke="#d4a843" stroke-width="1.5" opacity=".7"/>
        <!-- 瞳 -->
        <circle cx="40" cy="38" r="11" fill="#1a0800" stroke="#d4a843" stroke-width="1.5"/>
        <circle cx="40" cy="38" r="6" fill="#d4a843" opacity=".95"/>
        <circle cx="43" cy="35" r="2.5" fill="white" opacity=".7"/>
        <circle cx="40" cy="38" r="2" fill="#0a0400"/>

        <line x1="20" y1="28" x2="15" y2="20" stroke="#d4a843" stroke-width="1.5" opacity=".6"/>
        <line x1="30" y1="22" x2="27" y2="14" stroke="#d4a843" stroke-width="1.5" opacity=".6"/>
        <line x1="40" y1="20" x2="40" y2="12" stroke="#d4a843" stroke-width="1.5" opacity=".6"/>

      </svg>
    </div>
    <div class="title">&#9775; Birthday Oracle &#9775;</div>
    <div class="subtitle">―― 誕生日解読の神比術 ――</div>
  </div>
  <div class="instr">
    <div class="instr-corner tl"></div><div class="instr-corner tr"></div><div class="instr-corner bl"></div><div class="instr-corner br"></div><div class="instr-title">✦ 手順 ✦</div>
    <div class="steps">
      <div class="step"><div class="sn">1</div><div class="st">相手のスマホで電卓を立ち上げてもらい、<span class="hl">生まれた西暦</span>を入力してもらう<br><span class="dim">（例: 1991年 → 1991）</span></div></div>
      <div class="step"><div class="sn">2</div><div class="st">その数字に<span class="hl">×（かける）</span>を押してもらい、<span class="hl">誕生日を4桁</span>で入力してもらう<br><span class="dim">（6月23日 → 0623）</span></div></div>
      <div class="step"><div class="sn">3</div><div class="st"><span class="hl">＝</span>を押してもらい、出た数字を言ってもらう</div></div>
    </div>
  </div>
  <div class="divider"><div class="gem"></div></div>
  <div style="margin-bottom:18px">
    <div style="font-size:.85rem;letter-spacing:.2em;color:var(--gold);text-align:center;margin-bottom:12px;font-weight:700">✦ 言ってもらった数字を入力 ✦</div>
    <input type="number" id="binput" class="minput" placeholder="例: 1240393" inputmode="numeric">
  </div>
  <button class="rbtn" onclick="revealBirthday()">✦ 誕生日を当てる ✦</button>
  <div class="rarea" id="bres"></div>
</div>

function doSparkle(){var c=document.getElementById('sparkles');c.style.display='block';for(var i=0;i<28;i++){var s=document.createElement('div');s.className='sparkle';s.style.left=(25+Math.random()*50)+'%';s.style.top=(25+Math.random()*50)+'%';var ang=Math.random()*Math.PI*2,dist=80+Math.random()*120;s.style.setProperty('--dx',Math.cos(ang)*dist+'px');s.style.setProperty('--dy',Math.sin(ang)*dist+'px');s.style.animationDelay=Math.random()*0.3+'s';var sz=(2+Math.random()*4)+'px';s.style.width=sz;s.style.height=sz;c.appendChild(s);}setTimeout(function(){c.style.display='none';c.innerHTML='';},1800);}
function getDivisors(n){var d=[],i;for(i=1;i*i<=n;i++){if(n%i===0){d.push(i);if(i!==n/i)d.push(n/i);}}return d.sort(function(a,b){return a-b;});}
function factorStr(n){var f={},d=2,orig=n;while(d*d<=n){while(n%d===0){f[d]=(f[d]||0)+1;n=Math.floor(n/d);}d++;}if(n>1)f[n]=(f[n]||0)+1;return orig.toLocaleString()+' = '+Object.keys(f).map(function(p){return f[p]>1?p+'^'+f[p]:p;}).join(' × ');}
function calcAge(year,mmdd){var today=new Date();today.setHours(0,0,0,0);var s=String(mmdd).padStart(4,'0');var m=parseInt(s.slice(0,2)),d=parseInt(s.slice(2,4));var age=today.getFullYear()-year;if(today<new Date(today.getFullYear(),m-1,d))age--;return age;}
function isValidDate(mmdd){var s=String(mmdd).padStart(4,'0');var m=parseInt(s.slice(0,2)),d=parseInt(s.slice(2,4));if(m<1||m>12||d<1)return false;return d<=[31,29,31,30,31,30,31,31,30,31,30,31][m-1];}
function fmtDate(mmdd){var s=String(mmdd).padStart(4,'0');return parseInt(s.slice(0,2))+'月'+parseInt(s.slice(2,4))+'日';}
function weekday(year,mmdd){var s=String(mmdd).padStart(4,'0');var dt=new Date(year,parseInt(s.slice(0,2))-1,parseInt(s.slice(2,4)));return['日','月','火','水','木','金','土'][dt.getDay()]+'曜日';}
function daysLived(year,mmdd){var s=String(mmdd).padStart(4,'0');var b=new Date(year,parseInt(s.slice(0,2))-1,parseInt(s.slice(2,4)));var t=new Date();t.setHours(0,0,0,0);return Math.floor((t-b)/86400000).toLocaleString();}
function zodiac(mmdd){var s=String(mmdd).padStart(4,'0');var m=parseInt(s.slice(0,2)),d=parseInt(s.slice(2,4));var z=[{n:'山羊座',sym:'♑',em:1,ed:19},{n:'水瓶座',sym:'♒',em:2,ed:18},{n:'魚座',sym:'♓',em:3,ed:20},{n:'牡羊座',sym:'♈',em:4,ed:19},{n:'牡牛座',sym:'♉',em:5,ed:20},{n:'双子座',sym:'♊',em:6,ed:21},{n:'蟹座',sym:'♋',em:7,ed:22},{n:'獅子座',sym:'♌',em:8,ed:22},{n:'乙女座',sym:'♍',em:9,ed:22},{n:'天秤座',sym:'♎',em:10,ed:23},{n:'蠍座',sym:'♏',em:11,ed:22},{n:'射手座',sym:'♐',em:12,ed:21},{n:'山羊座',sym:'♑',em:12,ed:31}];for(var i=0;i<z.length;i++){if(m<z[i].em||(m===z[i].em&&d<=z[i].ed))return z[i];}return z[0];}
function getFamous(mmdd){var s=String(mmdd).padStart(4,'0');var m=parseInt(s.slice(0,2)),d=parseInt(s.slice(2,4));return FAMOUS[m+'-'+d]||null;}
function solveBirthday(n){var res=[],divs=getDivisors(n);function check(yr,md){var _now=new Date().getFullYear();if(yr>=(_now-100)&&yr<=_now&&md>=101&&md<=1231&&isValidDate(md)){var age=calcAge(yr,md);if(age>=0&&age<=100&&!res.find(function(r){return r.year===yr&&r.mmdd===md;}))res.push({year:yr,mmdd:md,age:age});}}for(var i=0;i<divs.length;i++){check(divs[i],n/divs[i]);check(n/divs[i],divs[i]);}return res;}
function revealBirthday(){
  var area=document.getElementById('bres');
  area.className='rarea';area.innerHTML='';
  var v=document.getElementById('binput').value.trim();
  if(!v||isNaN(v)){area.innerHTML='<div class="errmsg">数字を入力してください</div>';area.className='rarea show';return;}
  var n=parseInt(v);
  if(n<10000||n>99999999){area.innerHTML='<div class="errmsg">数値の範囲を確認してください</div>';area.className='rarea show';return;}
  var cands=solveBirthday(n);
  if(cands.length===0){area.innerHTML='<div class="nores">該当する誕生日が見つかりませんでした</div>';area.className='rarea show';return;}
  doSparkle();
  var html='';
  if(cands.length>1)html='<div class="rcount">✦ '+cands.length+' パターン見つかりました ✦</div>';
  cands.forEach(function(c,i){
    var z=zodiac(c.mmdd);
    var lbl=cands.length>1?'<div class="cnum">候補 '+(i+1)+' / '+cands.length+'</div>':'';
    var famous=getFamous(c.mmdd);
    var famHtml='';
    if(famous){
      famHtml='<div class="famous-block"><div class="famous-title">✦ 同じ誕生日の有名人 ✦</div><div class="famous-list">';
      famous.forEach(function(p){famHtml+='<div class="famous-item"><div class="famous-icon">'+p.icon+'</div><div><div class="famous-name">'+p.name+'</div><div class="famous-desc">'+p.desc+'</div></div></div>';});
      famHtml+='</div></div>';
    }
    html+='<div class="bcard">'+lbl+
      '<div class="crow"><span class="cl">生まれた年</span><span class="cv big">'+c.year+'年</span></div>'+
      '<div class="crow"><span class="cl">誕生日</span><span class="cv big">'+fmtDate(c.mmdd)+'</span></div>'+
      '<div class="crow"><span class="cl">年齢</span><span class="cv big">'+c.age+'歳</span></div>'+
      '<div class="egrid">'+
        '<div class="ecell"><span class="cl">誕生曜日</span><div class="cv">'+weekday(c.year,c.mmdd)+'</div></div>'+
        '<div class="ecell"><span class="cl">生まれてから</span><div class="cv dnum">'+daysLived(c.year,c.mmdd)+'</div><div class="csub">日</div></div>'+
        '<div class="ecell"><span class="cl">星座</span><span class="cv zsym">'+z.sym+'</span><div class="cv" style="font-size:.8rem">'+z.n+'</div></div>'+
      '</div>'+''+'</div>';
  });
  
  html+='<button class="rstbtn" onclick="doReset()">✦ もう一度 ✦</button>';
  area.innerHTML=html;
  requestAnimationFrame(function(){area.className='rarea show';});
  area.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function doReset(){document.getElementById('binput').value='';var a=document.getElementById('bres');a.className='rarea';a.innerHTML='';document.getElementById('binput').focus();}
document.getElementById('binput').addEventListener('keydown',function(e){if(e.key==='Enter')revealBirthday();});

<script>

var manifest = {

function buildIcon(size) {
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var ctx = c.getContext('2d');
  // 背景
  ctx.fillStyle = '#0a0800';
  ctx.fillRect(0, 0, size, size);
  // 外枠円
  ctx.strokeStyle = '#d4a843';
  ctx.lineWidth = size * 0.04;
  ctx.beginPath();
  ctx.arc(size/2, size/2, size*0.42, 0, Math.PI*2);
  ctx.stroke();
  // 目の白目
  ctx.fillStyle = '#1a1402';
  ctx.beginPath();
  ctx.ellipse(size/2, size/2, size*0.32, size*0.18, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#d4a843';
  ctx.lineWidth = size * 0.025;
  ctx.stroke();
  // 瞳
  ctx.fillStyle = '#d4a843';
  ctx.beginPath();
  ctx.arc(size/2, size/2, size*0.1, 0, Math.PI*2);
  ctx.fill();
  // 中心
  ctx.fillStyle = '#0a0400';
  ctx.beginPath();
  ctx.arc(size/2, size/2, size*0.04, 0, Math.PI*2);
  ctx.fill();
  return c.toDataURL('image/png');
}

window.addEventListener('load', function() {
  // icon
  var iconUrl = buildIcon(192);
  document.getElementById('pwa-icon').href = iconUrl;
  // manifest with icon dataURL
  manifest.icons = [
    { src: buildIcon(192), sizes: "192x192", type: "image/png" },
    { src: buildIcon(512), sizes: "512x512", type: "image/png" }
  ];
  var blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
});
